[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuance"
version = "0.1.0"
description = "Multi-label emotion classification, scored honestly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krish Mirpuri" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyarrow>=14",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
serve = ["fastapi>=0.109", "uvicorn[standard]>=0.27"]
app = ["streamlit>=1.31", "altair>=5.2"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "httpx>=0.26"]

[project.scripts]
nuance = "nuance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs the full corpora or trained artifacts"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
# SIM300 misfires on NumPy array comparisons: it reads `scores >= thresholds`
# as a Yoda condition and would rewrite it to `thresholds <= scores`, which is
# harder to read and says nothing different.
ignore = ["E501", "SIM300"]

[tool.coverage.run]
source = ["nuance"]
omit = ["*/dashboard/*"]
