name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.project }} · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [overbook, nuance]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: projects/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,app,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # Both suites build their own fixture data, so this needs no network and
      # no downloads. Tests that require trained artifacts skip.
      - name: Test
        run: pytest tests/ -q --cov --cov-report=term-missing

  pipeline:
    name: ${{ matrix.project }} end to end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [overbook, nuance]

    defaults:
      run:
        working-directory: projects/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,app,dev]"

      # Proves the documented numbers can be reproduced from a clean checkout.
      - name: Run the pipeline
        run: ${{ matrix.project }} all

      - name: Test against the trained artifacts
        run: pytest tests/ -q

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-results
          path: |
            projects/${{ matrix.project }}/reports/RESULTS.md
            projects/${{ matrix.project }}/reports/*.csv
            projects/${{ matrix.project }}/reports/*.json
            projects/${{ matrix.project }}/reports/figures/*.png
