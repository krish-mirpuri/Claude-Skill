name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,app,explain,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The suite builds its own synthetic extract, so this needs no network
      # and no 17 MB download. Tests that require trained artifacts skip.
      - name: Test
        run: pytest tests/ -q --cov=overbook --cov-report=term-missing

  pipeline:
    # Proves the documented numbers can actually be reproduced from scratch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,app,explain,dev]"

      - name: Run the whole pipeline
        run: overbook all

      - name: Test against the trained artifacts
        run: pytest tests/ -q

      - name: Publish the generated report
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            reports/RESULTS.md
            reports/*.csv
            reports/*.json
            reports/figures/*.png
